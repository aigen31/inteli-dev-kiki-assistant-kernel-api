openapi: "3.1.0"
info:
  title: Kiki Assistant Kernel API
  version: "1.0.0"
  license:
    name: MIT
    identifier: MIT
  description: |
    Central assistant kernel for inteli-dev. Channels call this API with a
    per-channel bearer token. The kernel owns conversation state, model
    routing, the tool loop and safety policy. Domain data stays in the site
    and CRM; the kernel calls their typed internal tools with a service token.

    Sessions (title, pin, archive) and message attachments live here too.
    Attachments are referenced by id only: the kernel pulls bytes from the
    channel provider, so the domain keeps storage and access checks.
  version: "1.3.0"
servers:
  - url: https://assistant.inteli-dev.ru
    description: Production
  - url: http://localhost:8090
    description: Local development
tags:
  - name: Chat
    description: One message in, one answer out.
  - name: Conversations
    description: Sessions, history, renaming, pinning, regeneration and notes.
  - name: Knowledge
    description: Shared snapshots owned by a domain service.
  - name: Studies
    description: Async site studies executed by the DeepSeek Harness sidecar.
  - name: Health
    description: Liveness and readiness probes.
security:
  - BearerAuth: []
paths:
  /v1/chat:
    post:
      tags: [Chat]
      operationId: chat
      summary: Send one message to Kiki
      description: |
        Creates or continues a conversation. The kernel loads the channel
        profile and tool schemas, routes the request to the local or cloud
        model, executes tool calls through the channel provider and returns
        the answer. Internal and secret data require the local route.
      parameters:
        - $ref: "#/components/parameters/Channel"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
            examples:
              site:
                summary: Public site question
                value:
                  channel: site
                  message: "Сколько стоит голосовой бот?"
                  actor: { id: "visitor-hash", role: "visitor" }
                  data_class: public
                  context: { url: "https://inteli-dev.ru/services" }
              crm:
                summary: CRM operator question
                value:
                  channel: crm
                  message: "Что сегодня в работе?"
                  conversation_id: "6f1e7f0e-2a6e-4a5a-8e5c-0f6f0f7a1b2c"
                  actor: { id: "5c1f0e5a-7a6c-4f2f-9c2e-2f7b2a3c4d5e", role: "admin" }
                  data_class: internal
      responses:
        "200":
          description: Answer and conversation state
          headers:
            X-Correlation-Id:
              schema: { type: string }
              description: Correlation ID for distributed tracing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: List an actor's sessions
      description: |
        Sessions are scoped to the channel token and the actor id. Search
        matches the title and the user messages of a session.
      parameters:
        - $ref: "#/components/parameters/Channel"
        - name: actor_id
          in: query
          required: true
          schema: { type: string, maxLength: 128 }
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: archived
          in: query
          required: false
          description: "`1`, `true` or `all` also returns archived sessions."
          schema: { type: string, enum: ["0", "1", "true", "all"] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Sessions, pinned first, then most recently updated
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/SessionSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/conversations/{conversation_id}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/Channel"
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Read conversation messages
      responses:
        "200":
          description: Conversation messages in chronological order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Conversations]
      operationId: updateConversation
      summary: Rename, pin or archive a session
      parameters:
        - name: actor_id
          in: query
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string, minLength: 1, maxLength: 80 }
                pinned: { type: boolean }
                archived: { type: boolean }
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Conversations]
      operationId: deleteConversation
      summary: Delete a conversation and its messages
      parameters:
        - name: actor_id
          in: query
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/conversations/{conversation_id}/regenerate:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/Channel"
    post:
      tags: [Conversations]
      operationId: regenerateConversation
      summary: Re-answer the last user turn
      description: |
        Drops the assistant and tool messages after the last user message and
        runs the turn again. No new user message is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor]
              properties:
                actor: { $ref: "#/components/schemas/Actor" }
                data_class:
                  type: string
                  enum: [public, internal, secret]
                context:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: New answer for the same user turn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/knowledge/pricing:
    get:
      tags: [Knowledge]
      operationId: getPricing
      summary: Shared price snapshot
      description: |
        The site owns the price list; the kernel caches a snapshot and serves it
        to every channel. When the site is down the last snapshot is returned
        with `stale: true` instead of an empty list.
      parameters:
        - $ref: "#/components/parameters/Channel"
        - name: force
          in: query
          required: false
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: Price snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/studies:
    get:
      tags: [Studies]
      operationId: listStudies
      summary: Studies of an actor
      parameters:
        - $ref: "#/components/parameters/Channel"
        - name: actor_id
          in: query
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Recent studies
          content:
            application/json:
              schema:
                type: object
                required: [studies]
                properties:
                  studies:
                    type: array
                    items: { $ref: "#/components/schemas/Study" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Studies]
      operationId: startStudy
      summary: Start a site study in the harness sidecar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor, url]
              properties:
                actor: { $ref: "#/components/schemas/Actor" }
                url: { type: string, maxLength: 500, description: Public http(s) site only. }
                focus: { type: string, maxLength: 300 }
                agents_md: { type: string, maxLength: 60000, description: Existing AGENTS.md to update. }
                instructions: { type: string, maxLength: 8000 }
      responses:
        "200":
          description: Study created, runner is working
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Study" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/studies/{study_id}:
    parameters:
      - name: study_id
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
      - $ref: "#/components/parameters/Channel"
      - name: actor_id
        in: query
        required: true
        schema: { type: string, maxLength: 128 }
    get:
      tags: [Studies]
      operationId: getStudy
      summary: Poll a study, including its event stream and result files
      responses:
        "200":
          description: Current study state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Study" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/studies/{study_id}/cancel:
    parameters:
      - name: study_id
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
      - $ref: "#/components/parameters/Channel"
      - name: actor_id
        in: query
        required: true
        schema: { type: string, maxLength: 128 }
    post:
      tags: [Studies]
      operationId: cancelStudy
      summary: Stop a running study
      responses:
        "200":
          description: Cancelled study
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Study" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/conversations/{conversation_id}/notes:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - $ref: "#/components/parameters/Channel"
    post:
      tags: [Conversations]
      operationId: appendNote
      summary: Append an assistant note after an out-of-band action
      description: |
        Used by the CRM after a confirmed action. The note becomes part of the
        conversation history so the next model call sees the outcome.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200":
          description: Stored message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /health/live:
    get:
      tags: [Health]
      operationId: live
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: live }
  /health/ready:
    get:
      tags: [Health]
      operationId: ready
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ready }
        "503":
          description: Database is not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: not_ready }
                  database: { type: boolean, const: false }
  /v1/harness/runs:
    post:
      tags: [Harness]
      operationId: startHarnessRun
      summary: Start a free-form research run in the harness sidecar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task]
              properties:
                task: { type: string, minLength: 8, maxLength: 2000 }
                url:
                  type: string
                  maxLength: 500
                  description: Optional public http(s) source; the same SSRF guard as studies.
      responses:
        "200":
          description: Run accepted by the harness
          content:
            application/json:
              schema:
                type: object
                required: [run_id, status]
                properties:
                  run_id: { type: string }
                  status: { type: string, enum: [running] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/harness/runs/{run_id}:
    parameters:
      - name: run_id
        in: path
        required: true
        schema: { type: string, maxLength: 120 }
      - $ref: "#/components/parameters/Channel"
    get:
      tags: [Harness]
      operationId: getHarnessRun
      summary: Poll a research run
      responses:
        "200":
          description: Current run state and the final answer when finished
          content:
            application/json:
              schema:
                type: object
                required: [run_id, status]
                properties:
                  run_id: { type: string }
                  status: { type: string, enum: [running, completed, failed, cancelled] }
                  answer: { type: string, nullable: true }
                  error: { type: string, nullable: true }
                  files:
                    type: object
                    additionalProperties: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/harness/runs/{run_id}/cancel:
    parameters:
      - name: run_id
        in: path
        required: true
        schema: { type: string, maxLength: 120 }
      - $ref: "#/components/parameters/Channel"
    post:
      tags: [Harness]
      operationId: cancelHarnessRun
      summary: Stop a research run
      responses:
        "200":
          description: Cancellation forwarded to the harness
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string }
                  status: { type: string, enum: [cancelled] }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Per-channel token (`KERNEL_SITE_TOKEN` or `KERNEL_CRM_TOKEN`).
  parameters:
    Channel:
      name: X-Kernel-Channel
      in: header
      required: true
      description: Must match the bearer token channel.
      schema: { type: string, enum: [site, crm] }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string, maxLength: 64 }
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$" }
  schemas:
    Actor:
      type: object
      required: [id, role]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        role: { type: string, minLength: 1, maxLength: 64 }
    ChatRequest:
      type: object
      required: [channel, message, actor]
      properties:
        channel: { type: string, enum: [site, crm] }
        message: { type: string, minLength: 1, maxLength: 8000 }
        conversation_id:
          type: string
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
          description: Opaque conversation key. Omit to create a new UUID.
        actor: { $ref: "#/components/schemas/Actor" }
        data_class:
          type: string
          enum: [public, internal, secret]
          description: |
            public may use cloud; internal and secret require the local model
            unless the operator explicitly allows a cloud fallback.
        context:
          type: object
          additionalProperties: true
          description: Channel-specific page or UI context.
        attachments:
          type: array
          maxItems: 8
          description: |
            Images attached to this turn. Only ids are sent; the kernel pulls
            bytes from the channel provider with its service token. Images are
            sent to the model on the turn that carries them and are replayed
            as text afterwards.
          items: { $ref: "#/components/schemas/Attachment" }
        documents:
          type: array
          maxItems: 5
          description: |
            Document manifests. The text stays in the channel; the model reads
            slices through the provider's `read_document` tool.
          items: { $ref: "#/components/schemas/DocumentRef" }
    DocumentRef:
      type: object
      required: [id]
      properties:
        id: { type: string, maxLength: 128 }
        name: { type: string, maxLength: 255 }
        mime: { type: string, maxLength: 150 }
        chars: { type: integer, minimum: 0 }
        preview: { type: string, maxLength: 500 }
    Attachment:
      type: object
      required: [id]
      properties:
        id: { type: string, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$" }
        name: { type: string, maxLength: 255 }
        mime: { type: string, maxLength: 100 }
    ChatResponse:
      type: object
      required: [conversation_id, title, answer, messages, source, route, model, usage, suggested_next, correlation_id]
      properties:
        conversation_id: { type: string, maxLength: 128 }
        title: { type: string, maxLength: 80 }
        answer: { type: string }
        message:
          oneOf:
            - $ref: "#/components/schemas/Message"
            - { type: "null" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        source:
          type: string
          enum: [kernel:cloud, kernel:local]
        route: { type: string, enum: [cloud, local] }
        model: { type: string }
        usage: { $ref: "#/components/schemas/Usage" }
        pending_action:
          oneOf:
            - $ref: "#/components/schemas/PendingAction"
            - { type: "null" }
        suggested_next:
          type: array
          items: { $ref: "#/components/schemas/SuggestedAction" }
        trace:
          type: array
          items: { $ref: "#/components/schemas/TraceStep" }
        correlation_id: { type: string }
    SessionSummary:
      type: object
      required: [id, title, pinned, archived, message_count, preview, created_at, updated_at]
      properties:
        id: { type: string, maxLength: 128 }
        title: { type: string, maxLength: 80 }
        pinned: { type: boolean }
        archived: { type: boolean }
        data_class: { type: string, enum: [public, internal, secret] }
        message_count: { type: integer, minimum: 0 }
        preview: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ConversationResponse:
      type: object
      required: [conversation_id, title, pinned, archived, messages]
      properties:
        conversation_id: { type: string, maxLength: 128 }
        title: { type: string, maxLength: 80 }
        pinned: { type: boolean }
        archived: { type: boolean }
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
    Message:
      type: object
      required: [id, role, content, created_at]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [system, user, assistant, tool] }
        content: { type: string }
        tool_calls:
          type: array
          items: { type: object, additionalProperties: true }
        tool_call_id: { type: string }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
          description: Image and document references carried by a user turn.
        trace:
          type: array
          items: { $ref: "#/components/schemas/TraceStep" }
        created_at: { type: string, format: date-time }
    Usage:
      type: object
      required: [prompt_tokens, completion_tokens]
      properties:
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }
    PendingAction:
      type: object
      additionalProperties: true
      description: Domain action prepared by a provider and awaiting confirmation.
    SuggestedAction:
      type: object
      required: [text, type]
      properties:
        text: { type: string }
        type: { type: string }
    TraceStep:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [note, tool] }
        step: { type: integer, minimum: 1 }
        name: { type: string }
        status: { type: string, enum: [ok, error] }
        text: { type: string }
        summary: { type: string }
        duration_ms: { type: integer, minimum: 0 }
    PriceList:
      type: object
      required: [items]
      properties:
        updated_at: { type: string }
        cached: { type: boolean }
        stale: { type: boolean }
        cached_at: { type: string }
        items:
          type: array
          items:
            type: object
            required: [title, price_from]
            properties:
              slug: { type: string }
              title: { type: string }
              description: { type: string }
              price_from: { type: string }
              unit: { type: string }
    Study:
      type: object
      required: [id, status, url]
      properties:
        id: { type: string }
        url: { type: string }
        focus: { type: string }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        runner_run_id: { type: string }
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        agents_md: { type: string }
        notes: { type: string }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        instance: { type: string, format: uri }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Channel, actor or data class is not allowed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Conversation not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UpstreamError:
      description: Model or channel provider failed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unprocessable:
      description: The routed model or deployment cannot serve this request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unavailable:
      description: Required model is unavailable
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
